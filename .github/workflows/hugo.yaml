name: Release to Github Pages

on:
  schedule:
    - cron: '0 0 1 1 *'
      timezone: "America/New_York"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      TZ: America/New_York
  
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false
      
      - name: Setup pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Create a local tools directory
        run: mkdir -p "${HOME}/.local"

      - name: Install Hugo
        run: |
          echo "Install Hugo ${HUGO_VERSION}"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log versions
        run: |
          echo "Building with verions"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Hugo build
        run: |
          echo "Building site"
          hugo build                                          \
            --gc                                              \
            --minify                                          \
            --baseURL "${{ steps.pages.outputs.base_url }}"   \
            --cacheDir "${{ runner.temp }}/.cache/hugo"
      
      - name: Save cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      
      - name: Save artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Publish to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5